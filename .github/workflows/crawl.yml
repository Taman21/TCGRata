name: crawl

on:
  schedule:
    - cron: "17 */6 * * *"  # cada 6h; repo privado = 2000 min/mes, ajustar segun lo que tarde un ciclo
  workflow_dispatch:

concurrency: crawl  # nunca dos crawls a la vez sobre el mismo estado

permissions:
  contents: write  # el estado vive en un release

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # tope para no quemar minutos si algo se cuelga
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore data.json (release "data")
        run: |
          gh release download data -p data.json.gz || echo "sin estado previo: crawl desde cero"
          if [ -f data.json.gz ]; then gunzip data.json.gz; fi

      - run: python -u crawler.py --no-discover

      # Antes de publicar: si el deploy falla igual queda guardado el crawl
      - name: Save data.json
        if: always()
        run: |
          python -c "import json; json.load(open('data.json', encoding='utf-8'))" || { echo "data.json invalido o ausente, no se sube"; exit 0; }
          gzip -c data.json > data.json.gz
          gh release view data > /dev/null 2>&1 || gh release create data --title data --notes "estado del crawler (privado)"
          gh release upload data data.json.gz --clobber

      - name: Deploy site/ to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@3 pages project create tcgrata --production-branch main || true
          npx --yes wrangler@3 pages deploy site --project-name tcgrata --branch main

      # Va al final y siempre: si >10% de las tiendas llevan 24 h sin crawl limpio, el run queda rojo y GitHub avisa por correo
      - name: Store health
        if: always()
        run: python crawler.py --health
